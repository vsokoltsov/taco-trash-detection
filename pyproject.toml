[project]
name = "taco-trash-segmentation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24",
    "Pillow>=10.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic[dotenv]>=2.13.4",
    "gdown>=5.0",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.32",
    "streamlit>=1.35",
    "google-genai>=2.11.0",
    "google-cloud-storage>=2.19",
]

[project.optional-dependencies]
# local dev on Mac — CPU only
dev = [
    "onnxruntime>=1.18",
    "requests>=2.31",
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "ruff>=0.9",
    "ty>=0.0.1a15",
]
# production Linux GPU server
gpu = [
    "onnxruntime-gpu==1.20.1",
]
# training (Mac or Linux)
train = [
    "torch>=2.1",
    "torchvision>=0.16",
    "albumentations>=1.3",
    "scikit-learn>=1.3",
    "torchmetrics>=1.0",
    "tensorboard>=2.14",
    "pycocotools>=2.0",
    "tqdm>=4.65",
    "pandas>=2.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
include = ["trash_annotation/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["trash_annotation"]
force-sort-within-sections = true


[tool.pytest.ini_options]
testpaths = ["trash_annotation/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
