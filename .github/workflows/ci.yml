name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  IMAGE_NAME: taco-trash-api
  MASK_RCNN_V1_GDRIVE_URL: "https://drive.google.com/file/d/1HBo9xJXSTkQkAHKrbgHFptVtZg-0kBB4/view?usp=sharing"
  YOLO_V8_GDRIVE_URL: "https://drive.google.com/file/d/19q4FulQTz2rot074mA8R537CAREDtRz1/view?usp=sharing"
  YOLO_V11_TOP5_GDRIVE_URL: "https://drive.google.com/file/d/13irdQZQC0VzpL88_QGGx2oir-gSUbaC6/view?usp=sharing"
  FAST_RCNN_GDRIVE_URL: "https://drive.google.com/file/d/15xL2DHPSqn-tkssJg10sMvoFMTPJX9Ry/view?usp=sharing"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run ruff
        run: uv run ruff check

  typecheck:
    name: Typecheck (ty)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run ty
        run: uv run ty check trash_annotation

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest trash_annotation/tests/ -v

  publish-api-image:
    name: Build and push API Docker image
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Set image tags
        id: image
        run: |
          IMAGE_REPOSITORY="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}/${IMAGE_NAME}"
          echo "sha=${IMAGE_REPOSITORY}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest=${IMAGE_REPOSITORY}:latest" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.sha }}
            ${{ steps.image.outputs.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  sync-models:
    name: Sync model artifacts to Cloud Storage
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Install Google Drive downloader
        run: python -m pip install --upgrade gdown

      - name: Download and upload models
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p models

          sync_model() {
            local url="$1"
            local filename="$2"
            local destination="gs://${{ vars.MODEL_BUCKET_NAME }}/models/${filename}"

            if gcloud storage ls "${destination}" >/dev/null 2>&1; then
              echo "Model already exists: ${destination}"
              return
            fi

            echo "Downloading ${filename}"
            gdown --fuzzy "${url}" -O "models/${filename}"

            echo "Uploading ${filename} to ${destination}"
            gcloud storage cp "models/${filename}" "${destination}"
          }

          sync_model "${MASK_RCNN_V1_GDRIVE_URL}" "mask_rcnn_v1.pt"
          sync_model "${YOLO_V8_GDRIVE_URL}" "yolo_v8.onnx"
          sync_model "${YOLO_V11_TOP5_GDRIVE_URL}" "yolo_v11_top5.onnx"
          sync_model "${FAST_RCNN_GDRIVE_URL}" "fast_rcnn.onnx"

  deploy-api:
    name: Deploy API to GKE
    runs-on: ubuntu-latest
    needs: [publish-api-image, sync-models]
    if: github.event_name == 'push'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials "${{ vars.GKE_CLUSTER_NAME }}" \
            --location "${{ vars.GKE_LOCATION }}" \
            --project "${{ vars.GCP_PROJECT_ID }}"

      - name: Deploy API Helm release
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_REPOSITORY="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}/${IMAGE_NAME}"

          cat > deploy-values.yaml <<EOF
          image:
            repository: "${IMAGE_REPOSITORY}"
            tag: "${GITHUB_SHA}"

          serviceAccount:
            create: true
            name: "taco-trash-api"
            annotations:
              iam.gke.io/gcp-service-account: "${{ vars.API_GOOGLE_SERVICE_ACCOUNT }}"

          ingress:
            enabled: true
            annotations:
              kubernetes.io/ingress.global-static-ip-name: "${{ vars.API_INGRESS_IP_NAME }}"

          env:
            STORAGE: "gcp"
            USE_GPU: "false"
            MASK_RCNN_V1_PATH: "gs://${{ vars.MODEL_BUCKET_NAME }}/models/mask_rcnn_v1.pt"
            YOLO_V8_PATH: "gs://${{ vars.MODEL_BUCKET_NAME }}/models/yolo_v8.onnx"
            YOLO_V11_TOP5_PATH: "gs://${{ vars.MODEL_BUCKET_NAME }}/models/yolo_v11_top5.onnx"
            FAST_RCNN_PATH: "gs://${{ vars.MODEL_BUCKET_NAME }}/models/fast_rcnn.onnx"
          EOF

          helm upgrade --install taco-trash-api infra/helm/taco-trash-api \
            --namespace "${{ vars.GKE_NAMESPACE }}" \
            --create-namespace \
            --values deploy-values.yaml \
            --wait \
            --timeout 10m

  deploy-ui:
    name: Deploy UI to App Engine
    runs-on: ubuntu-latest
    needs: [publish-api-image, sync-models]
    if: github.event_name == 'push'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Generate App Engine config
        run: |
          python - <<'PY'
          from pathlib import Path

          app_yaml = Path("app.yaml").read_text()
          app_yaml = app_yaml.replace(
              "https://REPLACE_WITH_API_INGRESS_URL",
              "${{ vars.API_URL }}",
          )
          Path("app.generated.yaml").write_text(app_yaml)
          PY

      - name: Deploy UI
        run: gcloud app deploy app.generated.yaml --project "${{ vars.GCP_PROJECT_ID }}" --quiet
