name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  IMAGE_NAME: taco-trash-api

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run ruff
        run: uv run ruff check

  typecheck:
    name: Typecheck (ty)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run ty
        run: uv run ty check trash_annotation

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest trash_annotation/tests/ -v

  publish-api-image:
    name: Build and push API Docker image
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Set image tags
        id: image
        run: |
          IMAGE_REPOSITORY="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}/${IMAGE_NAME}"
          echo "sha=${IMAGE_REPOSITORY}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest=${IMAGE_REPOSITORY}:latest" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.sha }}
            ${{ steps.image.outputs.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-api:
    name: Deploy API to GKE
    runs-on: ubuntu-latest
    needs: [publish-api-image]
    if: github.event_name == 'push'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials "${{ vars.GKE_CLUSTER_NAME }}" \
            --location "${{ vars.GKE_LOCATION }}" \
            --project "${{ vars.GCP_PROJECT_ID }}"

      - name: Deploy API Helm release
        shell: bash
        env:
          IMAGE_REPOSITORY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}/${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ github.sha }}
          API_GOOGLE_SERVICE_ACCOUNT: ${{ vars.API_GOOGLE_SERVICE_ACCOUNT }}
          API_INGRESS_IP_NAME: ${{ vars.API_INGRESS_IP_NAME }}
          MODEL_BUCKET_NAME: ${{ vars.MODEL_BUCKET_NAME }}
        run: |
          set -euo pipefail

          DEPLOY_VALUES="${RUNNER_TEMP}/api-values.yaml"
          envsubst < infra/deploy/api-values.yaml.tpl > "${DEPLOY_VALUES}"

          helm upgrade --install taco-trash-api infra/helm/taco-trash-api \
            --namespace "${{ vars.GKE_NAMESPACE }}" \
            --create-namespace \
            --values "${DEPLOY_VALUES}" \
            --wait \
            --timeout 10m

  deploy-ui:
    name: Deploy UI to App Engine
    runs-on: ubuntu-latest
    needs: [publish-api-image]
    if: github.event_name == 'push'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Generate App Engine config
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          envsubst < infra/deploy/app.yaml.tpl > app.generated.yaml

      - name: Deploy UI
        run: gcloud app deploy app.generated.yaml --project "${{ vars.GCP_PROJECT_ID }}" --quiet

      - name: Show UI URL
        run: gcloud app browse --project "${{ vars.GCP_PROJECT_ID }}" --no-launch-browser
